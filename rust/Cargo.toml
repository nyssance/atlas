[package]
name = "atlas-tauri"
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0-only"
description = "Native trackpad support for Nyssance Atlas"
repository = "https://github.com/nyssance/atlas"
readme = "README.md"
keywords = ["tauri", "trackpad", "gestures", "atlas"]
categories = ["gui"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/**"]

[features]
specta = ["dep:specta", "dep:tauri3-specta"]

[dependencies]
tauri = "3.0.0-alpha.5"
serde = { version = "1", features = ["derive"] }
log = "0.4"
specta = { version = "2.0.0-rc.27", optional = true }
tauri3-specta = { version = "0.1.0-alpha.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSEvent",
  "NSTouch",
  "NSView",
  "NSWindow",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Input", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
