name: Verify Atlas
on: [push, pull_request]
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun x --bun --no-install playwright install chromium
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run test:browser
      - run: cargo test --manifest-path rust/Cargo.toml --locked --features specta
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets --features specta -- -D warnings
