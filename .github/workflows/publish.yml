name: Publish Atlas
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: macos-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Verify tag
        run: bun -e 'if (process.env.GITHUB_REF_NAME !== `v${(await Bun.file("package.json").json()).version}`) process.exit(1)'
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun x --bun --no-install playwright install chromium
      - run: bun run test:browser
      - run: cargo test --manifest-path rust/Cargo.toml --locked --features specta
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets --features specta -- -D warnings
      - run: npm publish --access public --provenance
